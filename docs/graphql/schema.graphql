# ==========================================
# GraphQL Schema for AWS AppSync
# E-Commerce with WhatsApp Checkout Flow
# ==========================================
#
# This schema is optimized for an e-commerce application where:
# - Users browse products without authentication
# - Cart is managed in frontend (localStorage via Zustand)
# - Checkout happens via WhatsApp (no payment gateway)
# - Inventory is managed from a separate CMS
# - Analytics are tracked for business insights
#
# Architecture:
# - DynamoDB as data source
# - AppSync with public API key for catalog queries
# - IAM auth for CMS operations (create/update products)
# - Optional analytics tracking for WhatsApp inquiries

# ------------------------------------------
# PRODUCT CATALOG (Public Read-Only)
# ------------------------------------------

type Product
  @model
  @auth(
    rules: [
      { allow: public, operations: [read] }
      { allow: private, provider: iam } # CMS can create/update
    ]
  ) {
  id: ID!
  sku: String @index(name: "productBySKU")
  name: String!
  description: String!

  # Category relationship
  categoryId: ID!
    @index(
      name: "productsByCategory"
      sortKeyFields: ["priceDiscount"] # Sort by price within category
    )
  category: Category @belongsTo(fields: ["categoryId"])

  # Product details
  specs: AWSJSON # Flexible JSON for specs like { "RAM": "16GB", "Processor": "i7" }
  priceOriginal: Int! # Price in cents (e.g., 12999 = $129.99)
  priceDiscount: Int! # Discounted price in cents
  images: AWSJSON # Array of images as JSON
  # Variants (colors, sizes, etc.)
  variants: [ProductVariant] @hasMany(indexName: "variantsByProduct", fields: ["id"])

  # Featured products (for homepage) - stored as "true"/"false" string for GSI partition key
  featured: String
    @index(
      name: "productsByFeatured"
      sortKeyFields: ["createdAt"] # Featured products sorted by date
    )

  # Stock (informative only, updated from CMS)
  stockCount: Int
  isAvailable: Boolean # true/false to show "Out of Stock"
  # Rating & Social Proof
  ratingAverage: Float
  ratingCount: Int
  viewsToday: Int
  soldCount: Int

  # SEO & Analytics
  slug: String @index(name: "productBySlug") # URL-friendly name
  views: Int # Incremented when product is viewed
  inquiries: Int # How many times added to WhatsApp inquiries
  # Timestamps
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type ProductVariant
  @model
  @auth(rules: [{ allow: public, operations: [read] }, { allow: private, provider: iam }]) {
  id: ID!
  productId: ID! @index(name: "variantsByProduct")
  product: Product @belongsTo(fields: ["productId"])
  name: String! # e.g., "Titanio Natural - 256GB", "Rojo", "XL"
  type: VariantType!
  stockCount: Int
  isAvailable: Boolean
  images: AWSJSON # Variant-specific images
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

enum VariantType {
  color
  size
  material
  style
}

type Category
  @model
  @auth(rules: [{ allow: public, operations: [read] }, { allow: private, provider: iam }]) {
  id: ID!
  slug: String @index(name: "categoryBySlug")
  name: String!
  description: String
  imageUrl: String # S3 URL or external image
  parentCategoryId: ID # For nested categories
  products: [Product] @hasMany(indexName: "productsByCategory", fields: ["id"])
  order: Int # Display order in UI
  isActive: Boolean
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

# ------------------------------------------
# WHATSAPP ANALYTICS (Optional but Recommended)
# ------------------------------------------

type WhatsAppInquiry
  @model
  @auth(
    rules: [
      { allow: public, operations: [create] } # Anyone can create
      { allow: private, provider: iam } # Only CMS can read/update
    ]
  ) {
  id: ID!

  # Anonymous identification
  sessionId: String! @index(name: "inquiriesBySession")
  fingerprint: String # Browser fingerprint (optional)
  # Optional customer data (captured before WhatsApp redirect)
  customerName: String
  customerEmail: String @index(name: "inquiriesByEmail")
  customerPhone: String

  # Inquiry details
  items: AWSJSON! # [{ productId, variantId, quantity, priceAtInquiry, productName }]
  totalAmount: Int!
  totalItems: Int!

  # Generated WhatsApp message
  message: String

  # Metadata
  source: InquirySource
  userAgent: String
  referrer: String

  # Conversion tracking (updated from CMS)
  status: InquiryStatus
  convertedToSale: Boolean
  saleAmount: Int
  notes: String # Seller notes
  # Timestamps
  createdAt: AWSDateTime @index(name: "inquiriesByDate", sortKeyFields: ["totalAmount"])
  updatedAt: AWSDateTime
}

enum InquirySource {
  WEB
  MOBILE
  PWA
  FACEBOOK
  INSTAGRAM
}

enum InquiryStatus {
  PENDING # Just created
  CONTACTED # Customer contacted via WhatsApp
  NEGOTIATING # In negotiation
  CONVERTED # Sale completed
  LOST # Did not convert
  SPAM # Invalid inquiry
}

# ------------------------------------------
# INPUT TYPES
# ------------------------------------------

input ProductFilterInput {
  categoryId: ID
  minPrice: Int
  maxPrice: Int
  searchQuery: String
  isAvailable: Boolean
}

input CreateWhatsAppInquiryInput {
  sessionId: String!
  fingerprint: String
  customerName: String
  customerEmail: String
  customerPhone: String
  items: AWSJSON!
  totalAmount: Int!
  totalItems: Int!
  message: String!
  source: InquirySource
  userAgent: String
  referrer: String
}

# ------------------------------------------
# QUERIES
# ------------------------------------------

type Query {
  # Search products with filters
  searchProducts(
    filter: ProductFilterInput
    sort: ProductSort = RELEVANCE
    limit: Int = 20
    nextToken: String
  ): ProductConnection @function(name: "searchProducts-${env}")

  # Featured products (homepage)
  listFeaturedProducts(limit: Int = 10): [Product]

  # Products by category
  listProductsByCategory(
    categoryId: ID
    slug: String # Alternative to ID
    sort: ProductSort = PRICE_ASC
    limit: Int = 20
    nextToken: String
  ): ProductConnection

  # Single product
  getProduct(id: ID, slug: String): Product

  # Related products (based on category)
  getRelatedProducts(productId: ID!, limit: Int = 6): [Product]
    @function(name: "getRelatedProducts-${env}")

  # Analytics (CMS only)
  getInquiryStats(startDate: AWSDateTime!, endDate: AWSDateTime!): InquiryStats
    @function(name: "getInquiryStats-${env}")
    @auth(rules: [{ allow: private, provider: iam }])
}

type ProductConnection {
  items: [Product!]!
  nextToken: String
  total: Int
}

type InquiryStats {
  totalInquiries: Int!
  totalRevenue: Int!
  conversionRate: Float!
  topProducts: [ProductStat!]!
  inquiriesByDate: [DateStat!]!
}

type ProductStat {
  productId: ID!
  productName: String!
  inquiryCount: Int!
  revenue: Int!
}

type DateStat {
  date: String!
  inquiries: Int!
  revenue: Int!
}

enum ProductSort {
  RELEVANCE
  PRICE_ASC
  PRICE_DESC
  NEWEST
  POPULAR
}

# ------------------------------------------
# MUTATIONS
# ------------------------------------------

type Mutation {
  # Create WhatsApp inquiry (analytics tracking)
  createWhatsAppInquiry(input: CreateWhatsAppInquiryInput!): WhatsAppInquiry
    @function(name: "createWhatsAppInquiry-${env}")

  # Increment product views (analytics)
  incrementProductViews(productId: ID!): Product @function(name: "incrementProductViews-${env}")

  # CMS: Update product stock
  updateProductStock(productId: ID!, stockCount: Int!, isAvailable: Boolean!): Product
    @auth(rules: [{ allow: private, provider: iam }])

  # CMS: Update inquiry status
  updateInquiryStatus(
    inquiryId: ID!
    status: InquiryStatus!
    convertedToSale: Boolean
    saleAmount: Int
    notes: String
  ): WhatsAppInquiry @auth(rules: [{ allow: private, provider: iam }])
}

# ------------------------------------------
# SUBSCRIPTIONS (For CMS real-time updates)
# ------------------------------------------

type Subscription {
  # CMS: Listen to new inquiries
  onNewInquiry: WhatsAppInquiry
    @aws_subscribe(mutations: ["createWhatsAppInquiry"])
    @auth(rules: [{ allow: private, provider: iam }])

  # CMS: Product stock updates
  onProductStockUpdated(productId: ID): Product
    @aws_subscribe(mutations: ["updateProductStock"])
    @auth(rules: [{ allow: private, provider: iam }])
}
